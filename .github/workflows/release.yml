name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [xiao_c3, xiao_c6]
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches version.h
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "\"$TAG\"" firmware/tasky/version.h || { echo "::error::firmware/tasky/version.h does not match tag $GITHUB_REF_NAME"; exit 1; }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install -U platformio
      - run: pio run -e ${{ matrix.env }}
        working-directory: firmware
      - name: Collect release files
        run: |
          R=firmware/.pio/build/${{ matrix.env }}/release
          E=${{ matrix.env }}
          mkdir -p out && cp $R/* out/
          # Friendly names: full image for esptool, app-only for OTA via the Wi-Fi portal.
          mv out/tasky-$E-merged.bin "out/tasky-$E-${GITHUB_REF_NAME}.bin"
          cp out/tasky-$E-app.bin "out/tasky-$E-${GITHUB_REF_NAME}-ota.bin"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.env }}
          path: out/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true, path: dist }
      - run: cd dist && sha256sum *.bin > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **Install:** open https://tasky-flash.vercel.app in Chrome/Edge and click *Connect & flash* (keeps your settings unless you choose to erase).

            | File | Use |
            |---|---|
            | `tasky-<board>-${{ github.ref_name }}.bin` | Full image for `esptool.py write_flash 0x0 …` (erases settings) |
            | `tasky-<board>-${{ github.ref_name }}-ota.bin` | Over-Wi-Fi update: device **More → Update**, then upload in the setup page |
            | `tasky-<board>-{bootloader,partitions,boot_app0,app}.bin` + `-parts.json` | Individual parts (used by the web flasher) |
      - name: Redeploy the web flasher
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK not set, skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Vercel deploy triggered"
