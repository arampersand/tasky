; PlatformIO project config for Tasky firmware (square 240x240 ST7789)
; Sources live in tasky/ (Arduino sketch + .cpp/.h modules); tasky/tasky.ino
; also opens directly in the Arduino IDE.
; Pick your XIAO chip at build/flash time:
;   pio run -e xiao_c3            (compile)
;   pio run -e xiao_c3 -t upload  (flash over USB)
;   pio device monitor            (serial console @115200)
; Each build also writes .pio/build/<env>/tasky-<env>-merged.bin, a single
; image flashable at offset 0x0 (used by releases and the web flasher).

[platformio]
src_dir = tasky

[env]
; pioarduino fork -> Arduino-esp32 core 3.3.3. The official
; platformio/espressif32 platform is stuck at core 2.0.17, which lacks the 3.x
; LEDC API (ledcAttach) this firmware uses.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.33/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; Firmware is ~1.5MB; default 1.25MB app slot overflows. min_spiffs keeps dual
; OTA slots (1.875MB each) — required because the firmware ships OTA update.
board_build.partitions = min_spiffs.csv
extra_scripts = post:scripts/merge_bin.py
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit BusIO
    bblanchon/ArduinoJson@^7

[env:xiao_c3]
board = seeed_xiao_esp32c3

[env:xiao_c6]
board = seeed_xiao_esp32c6

; Tasky for Agents: computer companion (Bluetooth HID + Claude Code status)
[agents]
; Flash: ~1.74 MB on C3 and ~1.88 MB on C6 (its Bluetooth stack is ~140 KB
; bigger) of the 1.875 MiB (1,966,080 B) app slot. Keep new features small.
build_flags = -DTASKY_EDITION_AGENTS=1
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@^2.3

[env:xiao_c3_agents]
board = seeed_xiao_esp32c3
build_flags = ${agents.build_flags}
lib_deps = ${agents.lib_deps}

[env:xiao_c6_agents]
board = seeed_xiao_esp32c6
build_flags = ${agents.build_flags}
lib_deps = ${agents.lib_deps}
